<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dot-QR 56 | Lightweight Dot Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script type="module" crossorigin src="/Dot-QR-56/assets/index-d36f5ac7.js"></script>
  <link rel="stylesheet" href="/Dot-QR-56/assets/index-927b7fdc.css">
</head>

<body>
  <div id="app">
    <header>
      <h1>Dot-QR <span class="accent">56</span></h1>
    </header>
    <main>
      <div class="editor-container">
        <canvas id="editor-canvas" width="448" height="448"></canvas>
      </div>
      <aside class="controls">
        <!-- Drawing Tools Section -->
        <section class="tool-section" id="drawing-tools">
          <h2 class="section-title">🎨 Drawing Tools</h2>

          <div class="tool-group">
            <label class="tool-label" for="palette-select">Palette</label>
            <select id="palette-select"></select>
          </div>

          <div class="tool-group">
            <label class="tool-label">Color</label>
            <div id="color-container" class="color-pickers"></div>
          </div>

          <div class="tool-group">
            <label class="tool-label">Tools</label>
            <div id="tool-container" class="drawing-tools-bar"></div>
          </div>

          <div class="tool-group">
            <label class="tool-label">Brush Size</label>
            <div id="brush-container" class="brush-sizes"></div>
          </div>

          <div class="tool-group">
            <label class="tool-label">
              Symmetry
              <span class="info-tooltip" title="대칭 모드를 사용하면 절반의 데이터만 저장하여 URL 길이를 크게 줄일 수 있습니다.">ⓘ</span>
            </label>
            <div id="symmetry-container"></div>
          </div>

          <div class="tool-group tool-actions">
            <button id="clear-btn" class="clear-btn">🗑️ Clear All</button>
            <button id="preview-btn" class="preview-btn">👁️ Preview</button>
          </div>
        </section>

        <!-- Budget Tracker -->
        <div id="budget-tracker"></div>
      </aside>
    </main>

    <!-- QR Share Modal (Viewer Mode) -->
    <div id="qr-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content">
        <button id="close-modal-btn" class="modal-close">&times;</button>
        <h2 class="modal-title">📱 Share Image</h2>
        <div class="qr-container-large">
          <canvas id="qr-code-large"></canvas>
        </div>
        <p class="modal-hint">Scan with phone to view or edit</p>
        <div class="modal-actions">
          <button id="modal-copy-link-btn" class="primary-btn">🔗 Copy Link</button>
        </div>
      </div>
    </div>

    <!-- Analysis Tools Section -->
    <section class="tool-section" id="analysis-tools">
      <div class="section-header">
        <h2 class="section-title">📊 Analysis</h2>
        <button id="toggle-analysis-btn" class="icon-btn" title="Show Analysis">▲</button>
      </div>
      <div id="analysis-content" class="collapsed">
        <div id="analysis-dashboard"></div>
        <div class="url-section">
          <div id="url-output"></div>
        </div>
      </div>
    </section>
  </div>
  
</body>

</html>
